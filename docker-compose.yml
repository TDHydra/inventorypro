# InventoryPro — one-command self-host stack (builds everything from this repo).
#
#   cp .env.example .env   # edit the CHANGE_ME values
#   docker compose up -d --build
#
# Services: postgres 16, MinIO (media storage) + one-shot bucket init, the
# Fastify API (runs its own migrations on boot), and the Expo Web app (static,
# nginx). Put your own TLS proxy in front for anything internet-facing — see
# infra/DEPLOY-SELFHOST.md and infra/docker-compose.prod.yml.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorypro}
      POSTGRES_USER: ${POSTGRES_USER:-inventorypro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventorypro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # SEC-L #46: anonymous GetObject only — `mc anonymous set download` also
    # grants s3:ListBucket, letting anyone enumerate every media key. Keys are
    # unguessable (<entity>/<uuid>/<random-uuid>.jpg), so no-listing = a client
    # needs the exact key (held only in the auth-gated synced media table).
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing local/${MINIO_BUCKET:-inventorypro-media}
        cat > /tmp/anon-getobject.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${MINIO_BUCKET:-inventorypro-media}/*"]}]}
        JSON
        mc anonymous set-json /tmp/anon-getobject.json local/${MINIO_BUCKET:-inventorypro-media}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventorypro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventorypro}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Internal endpoint for server<->MinIO ops; the MinIO root credentials
      # double as the API's S3 keys (media routes fail closed if unset).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-inventorypro-media}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    # Static Expo Web build — the API URL is baked in at build time, so
    # rebuild (--build) whenever EXPO_PUBLIC_API_URL changes.
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  pgdata:
  miniodata:
