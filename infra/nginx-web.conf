# Static serving for the InventoryPro web build (SPA). NPM terminates TLS and
# proxies invenpro.app to this container's port 80.
# Note: sql.js runs on the main thread — NO COOP/COEP / SharedArrayBuffer headers
# are required.

# Security headers, tuned for the Expo-web app:
#  - frame-ancestors/X-Frame-Options: block clickjacking.
#  - nosniff: no MIME sniffing.
#  - HSTS: enforce HTTPS (NPM already terminates TLS).
#  - CSP: 'wasm-unsafe-eval' for sql.js; img/connect allow the API + S3 media
#    host + data/blob (camera).
#  nginx note: a location with its own add_header does NOT inherit these, so the
#  document location (= /index.html) repeats them below.
#
#  CSP hardening (frontend-hardening plan #4 — drop 'unsafe-inline'):
#   - script-src is 'self' 'wasm-unsafe-eval' only — NO 'unsafe-inline'. The
#     Expo static export loads its entry bundle via <script src>, so scripts are
#     already fully locked down; do not add 'unsafe-inline' here.
#   - style-src MUST keep 'unsafe-inline'. react-native-web (0.21) has no static
#     stylesheet/nonce pipeline in an `expo export` build: its StyleSheet
#     registry injects a runtime <style> element and it sets inline style="..."
#     attributes on elements. Both are blocked without 'unsafe-inline', which
#     breaks all rendering (unstyled/blank page). Nonces can't be applied to
#     styles react-native-web injects at runtime, so this is the tightest
#     style-src the current RN-Web build allows. Revisit if RN-Web gains
#     nonce/extracted-CSS support.
map $sent_http_content_type $csp {
  default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.invenpro.app https://s3.invenpro.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $csp always;

  # WebAssembly must be served as application/wasm or instantiateStreaming fails.
  location ~ \.wasm$ {
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Content-hashed bundles/assets — cache hard.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Never cache the app shell or (future) service worker. The document re-declares
  # the security headers (its own add_header breaks server-level inheritance).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
  }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /manifest.json { add_header Cache-Control "no-cache"; }

  # SPA fallback — expo-router does client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
