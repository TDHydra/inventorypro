# Static serving for the InventoryPro web build (SPA). NPM terminates TLS and
# proxies frontend.plexcontrol.com to this container's port 80.
# Note: sql.js runs on the main thread — NO COOP/COEP / SharedArrayBuffer headers
# are required.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # WebAssembly must be served as application/wasm or instantiateStreaming fails.
  location ~ \.wasm$ {
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Content-hashed bundles/assets — cache hard.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache the app shell or (future) service worker.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /manifest.json { add_header Cache-Control "no-cache"; }

  # SPA fallback — expo-router does client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
