# InventoryPro — production stack for Unraid, fronted by Nginx Proxy Manager (NPM).
#
# NPM (running separately) terminates TLS and routes your domains to the host
# ports exposed below. There is NO bundled nginx here — NPM is the edge.
#
#   api.invenpro.app      ->  http://<unraid-ip>:${API_PORT}      (Fastify API)
#   invenpro.app ->  http://<unraid-ip>:${WEB_PORT}      (Expo Web app — static)
#   s3.invenpro.app       ->  http://<unraid-ip>:${MINIO_PORT}    (MinIO S3 — media up/download)
#   minio.invenpro.app    ->  http://<unraid-ip>:${MINIO_CONSOLE_PORT}  (MinIO admin UI, optional)
#
# Postgres is intentionally NOT exposed to the host — it stays on the internal
# Docker network only.
#
# Usage:
#   cp .env.prod.example .env && edit it
#   docker compose -f docker-compose.prod.yml up -d
#
# (On Unraid: use the Compose Manager plugin, paste this file + the .env.)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorypro}
      POSTGRES_USER: ${POSTGRES_USER:-inventorypro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventorypro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Makes the console generate correct links when proxied by NPM.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API — NPM -> s3.<domain>
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Admin console — NPM -> minio.<domain> (optional)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    # SEC-L #46: anonymous GetObject only — NOT `mc anonymous set download`,
    # which also grants s3:ListBucket and lets anyone enumerate every media key.
    # Media keys are <entity>/<uuid>/<random-uuid>.jpg, so without listing a
    # client must already hold the exact (unguessable) key to fetch — the app
    # stores those keys in the synced, auth-gated media table. (List form + a
    # heredoc avoids the nested-quote parse errors a folded JSON policy hits.)
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing local/${MINIO_BUCKET:-inventorypro-media}
        cat > /tmp/anon-getobject.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${MINIO_BUCKET:-inventorypro-media}/*"]}]}
        JSON
        mc anonymous set-json /tmp/anon-getobject.json local/${MINIO_BUCKET:-inventorypro-media}
        # #188: today the browser PUT/GET works only because MinIO reflects
        # whatever Origin it's sent when no CORS rule is configured — that's
        # implicit any-origin, not a real allowlist. Pin it explicitly to the
        # web app's origin (install.sh sets MINIO_CORS_ORIGIN per-deploy).
        cat > /tmp/cors.xml <<'XML'
        <CORSConfiguration>
          <CORSRule>
            <AllowedOrigin>${MINIO_CORS_ORIGIN:-https://invenpro.app}</AllowedOrigin>
            <AllowedMethod>GET</AllowedMethod>
            <AllowedMethod>PUT</AllowedMethod>
            <AllowedMethod>HEAD</AllowedMethod>
            <AllowedHeader>content-type</AllowedHeader>
          </CORSRule>
        </CORSConfiguration>
        XML
        mc cors set local/${MINIO_BUCKET:-inventorypro-media} /tmp/cors.xml
    restart: "no"

  api:
    image: ${API_IMAGE:-inventorypro-api:latest}
    # If you don't have a prebuilt image, uncomment `build:` and run with --build
    # from a checkout of the monorepo on the host.
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventorypro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventorypro}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Internal endpoint for server<->MinIO operations:
      MINIO_ENDPOINT: http://minio:9000
      # Public endpoint baked into device-facing signed upload URLs:
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-inventorypro-media}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL}
      # Browser CORS allowlist (comma-separated) — the web origin(s). Without this
      # the API falls back to its built-in default and blocks the real web origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Trusted proxy subnet (NPM/Docker bridge) for correct request.ip behind the proxy.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Outbound mail. All four are required or mail.ts degrades to a no-op
      # (logs a warning, returns { sent: false }) — it never throws. Port 465 =
      # implicit TLS; anything else is treated as STARTTLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "${API_PORT:-3000}:3000"             # NPM -> api.<domain>
    # #238: log rotation lever. The API's pino logger writes to stdout (no file
    # transport — adding one would be a new dependency, and this container has
    # no writable log volume anyway), so stdout capture is entirely docker's
    # json-file driver. Left at its own defaults that driver never rotates —
    # one long-running container can grow an unbounded log file on the host.
    # Capping size/count here is the correct place for that, not the app: it
    # applies uniformly to whatever writes to stdout (pino now, anything else
    # later) without every service needing its own rotation logic.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    # Expo Web static build served by nginx. The API URL is baked at build time,
    # so rebuild (--build) whenever it changes.
    image: ${WEB_IMAGE:-inventorypro-web:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://api.invenpro.app}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"               # NPM -> invenpro.app

volumes:
  pgdata:
  miniodata:
