; InventoryPro all-in-one process supervisor: postgres + node API.
; supervisord restarts either process in-place if it crashes; a container
; restart still bounces both (documented tradeoff in Dockerfile.allinone).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
; loopback only — the DB is never reachable from outside the container.
command=postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
; postgres "fast shutdown" is SIGINT, not SIGTERM.
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
; Wait for postgres before exec'ing node — the API runs its own migrations on
; boot, so it must not race the DB coming up (or being restarted).
command=/bin/sh -c "until pg_isready -h 127.0.0.1 -U postgres -q; do sleep 1; done; exec node /app/apps/api/dist/index.js"
directory=/app
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
