services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorypro}
      POSTGRES_USER: ${POSTGRES_USER:-inventorypro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventorypro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # SEC-L #46: anonymous GetObject only (whole bucket, since clients render
    # PUBLIC_MEDIA_URL/<key> directly). The old `set download .../thumbnails`
    # both scoped to a non-existent prefix AND granted s3:ListBucket; GetObject
    # with no listing is the correct posture — unguessable keys gate access.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing local/${MINIO_BUCKET:-inventorypro-media}
        cat > /tmp/anon-getobject.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${MINIO_BUCKET:-inventorypro-media}/*"]}]}
        JSON
        mc anonymous set-json /tmp/anon-getobject.json local/${MINIO_BUCKET:-inventorypro-media}

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventorypro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventorypro}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-inventorypro-media}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL}
      # Browser CORS allowlist (comma-separated web origins) — must include the
      # web app's origin or the browser blocks API calls.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Trusted proxy subnet(s) for correct request.ip behind the bundled nginx.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Outbound mail — all of HOST/USER/PASS/FROM required or mail is a
      # logged no-op. Port 465 = implicit TLS, anything else = STARTTLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PORT: 3000
    ports:
      - "3000:3000"

  web:
    # Static Expo Web build — the API URL is baked in at build time, so
    # rebuild (--build) whenever EXPO_PUBLIC_API_URL changes.
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - minio

volumes:
  pgdata:
  miniodata:
