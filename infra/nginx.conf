events {
  worker_connections 1024;
}

http {
  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    # API
    location /api/ {
      proxy_pass http://api:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
    }

    # MinIO media (public thumbnails + presigned uploads)
    location /media/ {
      proxy_pass http://minio:9000/inventorypro-media/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO admin console. M5 (2026-08-09 audit): this was proxied to the public
    # internet with NO access control — the MinIO root login (full object store)
    # was one guessed/default password away for anyone who found the path. It is
    # now restricted to loopback + RFC1918 private ranges (deny by default); reach
    # it over a VPN or an SSH tunnel to the host. To open it deliberately, put
    # real auth in front (auth_basic, mTLS, or an SSO proxy) — never plain proxy_pass.
    location /minio-console/ {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://minio:9001/;
      proxy_set_header Host $http_host;
    }
  }
}
